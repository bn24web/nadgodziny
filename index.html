
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator nadgodzin</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 16px 12px;
    background: #eef2f6;
    color: #172334;
    font: 16px/1.45 system-ui, sans-serif;
  }

  main {
    max-width: 440px;
    margin: auto;
    padding: 24px;
    background: #fff;
    border-radius: 14px;
  }

  h1 {
    margin: 0 0 20px;
    font-size: 24px;
  }

  .godziny {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  label {
    display: block;
    font-weight: 600;
    min-width: 0;
  }

  input {
    display: block;
    width: 100%;
    min-width: 0;
    margin-top: 6px;
    padding: 12px 10px;
    border: 1px solid #aab6c5;
    border-radius: 8px;
    background: #fff;
    color: inherit;
    font: inherit;
    font-size: 26px;
    font-weight: 600;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  input:focus-visible {
    outline: 2px solid #2059a3;
    outline-offset: 2px;
  }

  .nastepna {
    margin-top: 16px;
  }

  .opcjonalne {
    color: #8993a0;
    font-size: 12px;
    font-weight: 400;
  }

  .tryby {
    display: flex;
    gap: 6px;
    padding: 4px;
    margin-bottom: 18px;
    background: #eef2f6;
    border-radius: 9px;
  }

  .tryby button {
    flex: 1;
    padding: 9px 6px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #687687;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .tryby button.aktywny {
    background: #fff;
    color: #2059a3;
    box-shadow: 0 1px 4px #00000015;
  }

  #wynik {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid #dce2e8;
  }

  .wiersz {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #edf0f3;
    font-size: 14px;
  }

  .wiersz:last-of-type {
    border-bottom: 0;
  }

  .wiersz b {
    text-align: right;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }

  .bez-przekroczenia {
    color: #17643b;
  }

  .czerwony {
    color: #a51d26;
  }

  .brak {
    color: #aab2bc;
  }

  .alarm {
    background: #fff1f1;
    border-left: 3px solid #bb252c;
    border-radius: 5px;
    padding: 12px;
    margin-top: 14px;
    color: #a51d26;
    font-size: 14px;
  }

  @media (max-width: 360px) {
    main {
      padding: 17px;
    }

    input {
      font-size: 22px;
    }
  }
</style>
</head>

<body>

<main>

  <h1>Kalkulator nadgodzin</h1>

  <div class="tryby">
    <button type="button"
            id="tryb-zegar"
            class="aktywny"
            aria-pressed="true">
      Zegar
    </button>

    <button type="button"
            id="tryb-klawiatura"
            aria-pressed="false">
      Klawiatura
    </button>
  </div>

  <div class="godziny">
    <label>
      Od
      <input id="od" type="time" step="60" required>
    </label>

    <label>
      Do
      <input id="do" type="time" step="60" required>
    </label>
  </div>

  <label class="nastepna">
    Start następnej służby
    <span class="opcjonalne">(opcjonalnie)</span>
    <input id="nastepna" type="time" step="60">
  </label>

  <footer id="wynik" aria-live="polite"></footer>

</main>

<script>

  const DOBA = 1440;
  const PROG = 720;

  const pole = id => document.getElementById(id);
  const pola = ['od', 'do', 'nastepna'];

  function formatujGodzine(data) {
    return String(data.getHours()).padStart(2, '0')
      + ':'
      + String(data.getMinutes()).padStart(2, '0');
  }

  // Ustawienie aktualnej godziny i początku 10 godzin wcześniej.

  function ustawGodziny() {
    const teraz = new Date();

    const minutyTeraz =
      teraz.getHours() * 60 + teraz.getMinutes();

    const minutyPoczatku =
      (minutyTeraz - 600 + DOBA) % DOBA;

    pole('do').value = formatujGodzine(teraz);

    pole('od').value =
      String(Math.floor(minutyPoczatku / 60))
        .padStart(2, '0')
      + ':'
      + String(minutyPoczatku % 60)
        .padStart(2, '0');

    pole('nastepna').value = '';
  }

  // Przełączanie pomiędzy zegarem a klawiaturą.

  function zmienTryb(tryb) {
    const klawiatura = tryb === 'klawiatura';

    if (!klawiatura) {
      for (const id of pola) {
        const wartosc = pole(id).value;

        if (wartosc && !Number.isFinite(minuty(wartosc))) {
          pole(id).focus();
          return;
        }
      }
    }

    pola.forEach(id => {
      const input = pole(id);
      const wartosc = input.value;

      input.type = klawiatura ? 'text' : 'time';

      if (klawiatura) {
        input.inputMode = 'numeric';
        input.maxLength = 5;
        input.placeholder = 'HH:MM';
      } else {
        input.removeAttribute('inputmode');
        input.removeAttribute('maxlength');
        input.removeAttribute('placeholder');
      }

      input.value = wartosc;
    });

    pole('tryb-zegar').classList.toggle(
      'aktywny', !klawiatura
    );

    pole('tryb-klawiatura').classList.toggle(
      'aktywny', klawiatura
    );

    pole('tryb-zegar').setAttribute(
      'aria-pressed', String(!klawiatura)
    );

    pole('tryb-klawiatura').setAttribute(
      'aria-pressed', String(klawiatura)
    );

    oblicz();
  }

  pole('tryb-zegar').addEventListener('click', () => {
    zmienTryb('zegar');
  });

  pole('tryb-klawiatura').addEventListener('click', () => {
    zmienTryb('klawiatura');
  });

  // Automatyczne formatowanie wpisywanych cyfr.

  function formatujWpis(input) {
    if (input.type !== 'text') return;

    let cyfry = input.value
      .replace(/\D/g, '')
      .slice(0, 4);

    if (cyfry.length > 2) {
      cyfry = cyfry.slice(0, 2)
        + ':'
        + cyfry.slice(2);
    }

    input.value = cyfry;
  }

  function minuty(godzina) {
    if (!/^\d{2}:\d{2}$/.test(godzina)) {
      return NaN;
    }

    const [h, m] = godzina.split(':').map(Number);

    return h < 24 && m < 60
      ? h * 60 + m
      : NaN;
  }

  function czas(m) {
    const h = Math.floor(m / 60);
    const min = m % 60;

    return (h ? h + ' godz.' : '')
      + (h && min ? ' ' : '')
      + (min || !h ? min + ' min' : '');
  }

  function godzina(m) {
    const dzien = Math.floor(m / DOBA);
    const h = Math.floor((m % DOBA) / 60);
    const min = m % 60;

    return String(h).padStart(2, '0')
      + ':'
      + String(min).padStart(2, '0')
      + (
        dzien
          ? ' (+' + dzien
            + (dzien === 1 ? ' dzień)' : ' dni)')
          : ''
      );
  }

  function policz(od, koniec, nastepna) {

    if (![od, koniec].every(Number.isFinite)) {
      return null;
    }

    if (od === koniec) {
      return { blad: true };
    }

    // Obsługa służby przechodzącej przez północ.

    if (koniec < od) {
      koniec += DOBA;
    }

    if (Number.isFinite(nastepna)) {

      nastepna += Math.floor(koniec / DOBA) * DOBA;

      if (nastepna < koniec) {
        nastepna += DOBA;
      }

    } else {
      nastepna = null;
    }

    const sluzba = koniec - od;

    const minimalny =
      sluzba >= PROG ? sluzba : null;

    const najwczesniej =
      minimalny === null
        ? null
        : koniec + minimalny;

    return {
      od,
      koniec,
      nastepna,
      sluzba,
      minimalny,
      najwczesniej,

      przekroczenie:
        Math.max(0, sluzba - PROG),

      odpoczynek:
        nastepna === null
          ? null
          : nastepna - koniec
    };
  }

  function oblicz() {

    const wynik = pole('wynik');

    const r = policz(
      minuty(pole('od').value),
      minuty(pole('do').value),
      minuty(pole('nastepna').value)
    );

    if (!r) {
      wynik.textContent =
        'Wprowadź prawidłowe godziny Od i Do.';
      return;
    }

    if (r.blad) {
      wynik.innerHTML = `
        <div class="alarm">
          Godziny Od i Do są identyczne.
          Nie można określić długości służby.
        </div>`;
      return;
    }

    const klasaPrzekroczenia =
      r.przekroczenie > 0
        ? 'czerwony'
        : 'bez-przekroczenia';

    let html = `

      <div class="wiersz">
        <span>Całkowita długość służby:</span>
        <b>${czas(r.sluzba)}</b>
      </div>

      <div class="wiersz">
        <span>Przekroczony czas pracy:</span>
        <b class="${klasaPrzekroczenia}">
          ${czas(r.przekroczenie)}
        </b>
      </div>

      <div class="wiersz">
        <span>Minimalny odpoczynek:</span>
        <b class="${r.minimalny === null ? 'brak' : ''}">
          ${r.minimalny === null
            ? '—'
            : czas(r.minimalny)}
        </b>
      </div>

      <div class="wiersz">
        <span>Najwcześniejsza kolejna służba:</span>
        <b class="${r.najwczesniej === null ? 'brak' : ''}">
          ${r.najwczesniej === null
            ? '—'
            : godzina(r.najwczesniej)}
        </b>
      </div>

    `;

    if (
      pole('nastepna').value !== ''
      && !Number.isFinite(minuty(pole('nastepna').value))
    ) {
      html += `
        <div class="alarm">
          Wprowadź prawidłową godzinę następnej służby.
        </div>`;
    }

    if (
      r.nastepna !== null
      && (
        (
          r.najwczesniej !== null
          && r.nastepna < r.najwczesniej
        )
        || r.odpoczynek === 0
      )
    ) {
      html += `
        <div class="alarm">
          <b>Krótki odpoczynek.</b>
          Brak możliwości rozpoczęcia następnej służby
          o zaplanowanej godzinie.
        </div>
      `;
    }

    wynik.innerHTML = html;
  }

  pola.forEach(id => {

    const input = pole(id);

    input.addEventListener('input', () => {
      formatujWpis(input);
      oblicz();
    });

    input.addEventListener('change', oblicz);

  });

  ustawGodziny();
  oblicz();

</script>

</body>
</html>
